dependencies:
  idf: ">=5.5.1"
  badgeteam/badge-bsp: "^0.9.9"
  # AppFS metadata (free/total) for the Storage Viewer — same component + API
  # (appfsGetFreeMem/appfsGetTotalMem) the launcher uses under its Apps tile.
  badgeteam/appfs: "^1.0.2"
  nicolaielectronics/tanmatsu-wifi: "^1.1.2"
  # LVGL 9 — the sole UI toolkit (pax-gfx was retired in the LVGL-only cleanup).
  lvgl/lvgl: "^9.2.0"
  # rx_boost shipped upstream in tanmatsu-lora v0.3.0 (paired with
  # tanmatsu-radio v3.2.0). Bumped to ^0.5.5 (2026-07-20, #80): the v0.3.x
  # client's GET_CONFIG used a fixed response buffer sized for the older,
  # smaller config struct and hard-fails (ESP_ERR_INVALID_SIZE) against
  # radio firmware >=v3.4.0's larger reply. tanmatsu-radio and
  # tanmatsu-launcher already track ^0.5.5.
  nicolaielectronics/tanmatsu-lora: "^0.5.5"
