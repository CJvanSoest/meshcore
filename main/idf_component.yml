dependencies:
  # SPIKE (task #4): ESP-IDF 6 migration. Nicolai's P4 stack (tanmatsu-launcher)
  # moved to idf >=6.0.2; the component majors below are the versions it pins.
  # badge-bsp 0.9->1.4 and appfs 1->2 are breaking API bumps — expect churn.
  idf: ">=6.0.2"
  badgeteam/badge-bsp: "^1.4.0"
  # AppFS metadata (free/total) for the Storage Viewer — same component + API
  # (appfsGetFreeMem/appfsGetTotalMem) the launcher uses under its Apps tile.
  badgeteam/appfs: "^2.1.0"
  nicolaielectronics/tanmatsu-wifi: "^1.3.1"
  # LVGL 9 — the sole UI toolkit (pax-gfx was retired in the LVGL-only cleanup).
  lvgl/lvgl: "^9.2.0"
  # rx_boost shipped upstream in tanmatsu-lora v0.3.0 (paired with
  # tanmatsu-radio v3.2.0). tanmatsu-launcher tracks 0.6.0 on the IDF6 line.
  nicolaielectronics/tanmatsu-lora: "^0.6.0"
